<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMOKING_PREVENTION.EXE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="scanline"></div>

        <!-- HOOK SCENE -->
        <div id="scene-hook" class="scene">
            <div id="hook-content" class="center-content">
                <div id="hook-text" class="hook-text"></div>
            </div>
        </div>

        <!-- BOOT SCENE -->
        <div id="scene-boot" class="scene">
            <div id="boot-log" class="terminal-text"></div>
        </div>

        <!-- ENCOUNTER SCENE -->
        <div id="scene-encounter" class="scene">
            <div id="encounter-hud" class="hud">
                <div class="hud-left">
                    <div class="hud-item">PLAYER: <span class="highlight">USER_01</span></div>
                    <div class="hud-item">STATUS: <span id="encounter-status" class="status-normal">NORMAL</span></div>
                </div>
                <div class="hud-center">
                    <div class="location-label">학교 뒤편</div>
                </div>
                <div class="hud-right">
                    <div class="hud-item">HEALTH</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:100%"></div><span class="progress-text">100%</span></div>
                </div>
            </div>
            <div id="encounter-world" class="game-world">
                <div id="ground-enc"></div>
                <div id="player-enc" class="character player-stopped">
                    <div class="char-head"></div>
                    <div class="char-body"></div>
                    <div class="char-legs">
                        <div class="char-leg left"></div>
                        <div class="char-leg right"></div>
                    </div>
                </div>
                <div id="npc-character" class="character npc">
                    <div class="char-head npc-head"></div>
                    <div class="char-body npc-body"></div>
                    <div class="char-legs">
                        <div class="char-leg left"></div>
                        <div class="char-leg right"></div>
                    </div>
                    <div id="npc-indicator" class="npc-indicator">!</div>
                </div>
                <div id="smoke-particles" class="smoke-particles"></div>
            </div>
            <div id="system-alert" class="system-alert"></div>
            <div id="dialogue-box" class="dialogue-box">
                <div class="dialogue-name">NPC</div>
                <div id="dialogue-text" class="dialogue-text"></div>
            </div>
        </div>

        <!-- CHOICE SCENE -->
        <div id="scene-choice" class="scene">
            <div id="choice-hud" class="hud">
                <div class="hud-left">
                    <div class="hud-item">PLAYER: <span class="highlight">USER_01</span></div>
                    <div class="hud-item">STATUS: <span class="status-normal">NORMAL</span></div>
                </div>
                <div class="hud-center">
                    <div class="alert-badge">⚠ 흡연 권유 감지</div>
                </div>
            </div>
            <div id="choice-content" class="center-content">
                <div id="choice-context" class="choice-context"></div>
                <div id="choice-question" class="choice-question"></div>
                <div id="choice-options" class="choice-options">
                    <button id="choice-1" class="choice-btn" data-choice="1">[ 1 ] 거절한다</button>
                    <button id="choice-2" class="choice-btn" data-choice="2">[ 2 ] 받아본다</button>
                </div>
            </div>
        </div>

        <!-- BAD CHOICE SCENE -->
        <div id="scene-bad" class="scene">
            <div id="bad-hud" class="hud">
                <div class="hud-left">
                    <div class="hud-item">PLAYER: <span class="highlight">USER_01</span></div>
                    <div class="hud-item">STATUS: <span id="bad-status"></span></div>
                </div>
                <div class="hud-right">
                    <div class="stat-group">
                        <div class="hud-item" id="bad-health-label">폐활량</div>
                        <div class="progress-bar"><div id="bad-health" class="progress-fill" style="width:100%"></div><span id="bad-health-text" class="progress-text">100%</span></div>
                    </div>
                    <div class="stat-group">
                        <div class="hud-item" id="bad-stamina-label">체력</div>
                        <div class="progress-bar"><div id="bad-stamina" class="progress-fill" style="width:100%"></div><span id="bad-stamina-text" class="progress-text">100%</span></div>
                    </div>
                    <div class="stat-group">
                        <div class="hud-item" id="bad-focus-label">집중력</div>
                        <div class="progress-bar"><div id="bad-focus" class="progress-fill" style="width:100%"></div><span id="bad-focus-text" class="progress-text">100%</span></div>
                    </div>
                </div>
            </div>
            <div id="bad-content" class="center-content">
                <div id="bad-message"></div>
                <div id="bad-submessage" class="bad-submessage"></div>
            </div>
        </div>

        <!-- ERROR SCENE -->
        <div id="scene-error" class="scene">
            <div id="error-content">
                <div id="error-messages"></div>
            </div>
        </div>

        <!-- GAME OVER SCENE -->
        <div id="scene-gameover" class="scene">
            <div id="gameover-content" class="center-content">
                <div id="gameover-title"></div>
                <div id="gameover-cause" class="gameover-cause"></div>
            </div>
        </div>

        <!-- REALITY SCENE -->
        <div id="scene-reality" class="scene">
            <div id="reality-content" class="center-content">
                <div id="reality-msg-1" class="reality-message"></div>
                <div id="reality-msg-2" class="reality-message reality-message-strong"></div>
            </div>
        </div>

        <!-- FINAL MESSAGE SCENE -->
        <div id="scene-final" class="scene">
            <div id="final-content" class="center-content">
                <div id="final-msg" class="final-message"></div>
                <div id="final-label" class="final-label"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
